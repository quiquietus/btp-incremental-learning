# One web service on Render's free plan: the portal (login), the aggregation
# server and the three client nodes, all behind one address.
services:
  - type: web
    name: btp-fedhar-portal
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn portal.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MALLOC_ARENA_MAX     # keeps the four-in-one process well under 512 MB
        value: "2"
      - key: ROUND_TIMEOUT        # three nodes share one small CPU
        value: "600"
