<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Federated server sign in</title><link rel="stylesheet" href="/shared/style.css"></head>
<body>
<div class="card login">
  <h2>Federated HAR server <span class="badge purple">aggregator</span></h2>
  <p class="quiet">Admins run rounds and manage users. Viewers and client operators can watch aggregation live.</p>
  <form id="f" class="row" style="flex-direction:column;align-items:stretch">
    <label class="f">Username <input name="username" autocomplete="username" required></label>
    <label class="f">Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <p class="quiet">Demo accounts: <span class="mono">admin</span>, <span class="mono">viewer</span>, <span class="mono">client1..3</span> (passwords set on the server).</p>
</div>
<script type="module">
import { doLogin, session } from '/shared/common.js';
if (session.token) location.href = '/admin';
const f = document.getElementById('f');
f.onsubmit = e => { e.preventDefault(); doLogin(f, document.getElementById('err'), '', () => location.href = '/admin'); };
</script>
</body></html>
